interface:
  display_name: "StatusGlance / RunGlance"
  short_description: "Live progress and verified run outcomes"
  default_prompt: "Use $runglance to read one existing task snapshot: active lanes, concrete results, measured or unknown progress, blockers, and next milestone. Do not start, watch, verify, finish, or configure a run for this status request."
policy:
  allow_implicit_invocation: true
